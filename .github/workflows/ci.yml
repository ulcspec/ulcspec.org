
name: ulcspec.org CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify locked copy survives the build (verbatim grep)
        run: |
          set -euo pipefail
          BUILD=dist/index.html
          test -f "$BUILD" || (echo "no dist/index.html"; exit 1)
          grep -F "National Lighting Bureau AI Think Tank 2026" "$BUILD"
          grep -F "Designers spec faster when manufacturers publish ULC." "$BUILD"
          grep -F "Manufacturers reach designers who specify ULC-readable products." "$BUILD"
          grep -F "In active dialogue with DIAL" "$BUILD"
          grep -F "This list will populate as manufacturers publish" "$BUILD"
          if grep -F "Enlighten Europe" "$BUILD"; then
            echo "FAIL: forbidden 'Enlighten Europe' string leaked into build output"
            exit 1
          fi

      - name: Verify all v1 routes built
        run: |
          set -euo pipefail
          for route in for-designers for-manufacturers validator spec governance downloads; do
            f="dist/${route}/index.html"
            test -f "$f" || (echo "FAIL: missing $f"; exit 1)
            grep -F "ULC home" "$f" >/dev/null \
              || (echo "FAIL: $f missing nav chrome"; exit 1)
          done
          echo "All 6 v1 routes built and ship nav chrome."

      - name: Verify sitemap + robots + llms artifacts
        run: |
          set -euo pipefail
          test -f dist/sitemap-index.xml || (echo "FAIL: dist/sitemap-index.xml missing"; exit 1)
          test -f dist/sitemap-0.xml || (echo "FAIL: dist/sitemap-0.xml missing"; exit 1)
          test -f dist/robots.txt || (echo "FAIL: dist/robots.txt missing"; exit 1)
          test -f dist/llms.txt || (echo "FAIL: dist/llms.txt missing"; exit 1)
          grep -F "Sitemap: https://ulcspec.org/sitemap-index.xml" dist/robots.txt
          for route in for-designers for-manufacturers validator spec governance downloads; do
            grep -F "https://ulcspec.org/${route}" dist/sitemap-0.xml \
              || (echo "FAIL: sitemap missing route $route"; exit 1)
          done
          grep -F "<loc>https://ulcspec.org/</loc>" dist/sitemap-0.xml \
            || (echo "FAIL: sitemap missing homepage"; exit 1)
          echo "Sitemap + robots + llms artifacts OK."

      - name: Validate JSON-LD structure
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('dist/index.html', 'utf8');
            const matches = html.match(/<script type=\"application\/ld\\+json\"[^>]*>([\\s\\S]*?)<\\/script>/g);
            if (!matches || matches.length === 0) { console.error('FAIL: no JSON-LD found'); process.exit(1); }
            for (const m of matches) {
              const body = m.replace(/<script[^>]*>/, '').replace(/<\\/script>/, '');
              const parsed = JSON.parse(body);
              const arr = Array.isArray(parsed) ? parsed : [parsed];
              for (const obj of arr) {
                if (!obj['@context']) { console.error('FAIL: missing @context'); process.exit(1); }
                if (!obj['@type']) { console.error('FAIL: missing @type'); process.exit(1); }
              }
              console.log('JSON-LD OK: ' + arr.map(o => o['@type']).join(', '));
            }
          "

      - name: Verify Cloudflare Analytics beacon gate (off without token)
        run: |
          set -euo pipefail
          BUILD=dist/index.html
          if grep -q "static.cloudflareinsights.com" "$BUILD"; then
            echo "FAIL: Cloudflare beacon present in $BUILD without PUBLIC_CF_ANALYTICS_TOKEN set in CI. Gate is broken."
            exit 1
          fi
          echo "Beacon correctly absent when no token is configured."

      - name: Verify OG image artifact is committed
        # The PNG cannot be byte-deterministically regenerated in CI: the SVG
        # source declares font-family="Inter, ..." with a system fallback
        # cascade that resolves differently on Ubuntu runners (DejaVu Sans) vs
        # macOS local (Helvetica Neue). Re-running `pnpm og:build` here would
        # produce a Linux-flavored PNG that never matches the macOS-flavored
        # PNG committed to the repo. Bundling Inter into the runner is the
        # deterministic fix; until then, we treat the committed PNG as
        # authoritative and only guard against the realistic regression
        # (file deleted, file zero-bytes, file is not actually a PNG).
        # Designers regenerate locally via `pnpm og:build` whenever the SVG
        # source changes.
        run: |
          set -euo pipefail
          test -f public/og-image.png \
            || (echo "FAIL: public/og-image.png is missing. Run 'pnpm og:build' locally and commit the result."; exit 1)
          size=$(wc -c < public/og-image.png)
          test "$size" -gt 10000 \
            || (echo "FAIL: public/og-image.png is suspiciously small ($size bytes); expected >10KB."; exit 1)
          magic=$(od -An -t x1 -N 4 public/og-image.png | tr -d ' ')
          test "$magic" = "89504e47" \
            || (echo "FAIL: public/og-image.png is not a valid PNG (bad magic bytes: $magic)."; exit 1)
          echo "OG image present (${size} bytes, valid PNG header)."

      - name: Lighthouse CI
        run: pnpm exec lhci autorun

      - name: Clear legacy commit-status (modern check-runs are authoritative)
        # Post a synthetic success status to the PR head SHA so the legacy
        # combined-status API flips from pending to success without manual
        # intervention. github.sha on pull_request events resolves to the
        # synthetic merge commit, not the PR head, so prefer
        # github.event.pull_request.head.sha and fall back to github.sha
        # on push events.
        if: success()
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${TARGET_SHA}" \
            -d '{
              "state": "success",
              "context": "ci/legacy-status-clear",
              "description": "Modern check-runs all green; legacy status resolved."
            }'

