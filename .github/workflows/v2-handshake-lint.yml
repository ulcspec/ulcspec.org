
name: ulcspec.org v2-handshake-lint

# Runs on every PR to main (no paths filter). This job is a required status
# check in the "Target Main" ruleset, and a path-filtered required check never
# reports on PRs that miss those paths, which silently blocks the merge. The
# steps below already guard on file presence, so this stays cheap when the
# launchpad envelope is untouched.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  v2-handshake-lint:
    name: v2-handshake-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify .launchpad envelope shape
        run: |
          if [ -f .launchpad/scaffold-decision.json ]; then
            python3 -c "import json,sys; p=json.load(open('.launchpad/scaffold-decision.json')); assert 'schema_version' in p, 'missing schema_version'; print('decision OK')"
          fi
          if [ -f .launchpad/bootstrap-manifest.json ]; then
            python3 -c "import json,sys; p=json.load(open('.launchpad/bootstrap-manifest.json')); assert p.get('manifest_schema_version') in ('1.0',), 'unsupported manifest_schema_version'; assert p.get('security_fields') in ([],None), 'security_fields must be empty in v2.1'; print('manifest OK')"
          fi

